<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow Cytometry Antibody Enumeration</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f5f7fa;
            color: #1a1a2e;
            line-height: 1.6;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
            color: #16213e;
        }
        .subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
        }
        .panels {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .panel {
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 0.6rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .panel-checkbox {
            width: 1rem;
            height: 1rem;
            cursor: pointer;
            flex-shrink: 0;
        }
        .panel-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: #0f3460;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .panel-antibodies {
            font-size: 0.9rem;
            color: #495057;
        }
        #results {
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            display: none;
        }
        #results h2 {
            font-size: 1.2rem;
            color: #0f3460;
            margin-bottom: 0.8rem;
        }
        .results-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .count-badge {
            display: inline-block;
            background: #0f3460;
            color: #fff;
            padding: 0.2rem 0.8rem;
            border-radius: 12px;
            font-size: 0.9rem;
        }
        .copy-btn {
            background: #0f3460;
            color: #fff;
            border: none;
            padding: 0.3rem 0.8rem;
            font-size: 0.85rem;
            border-radius: 6px;
            cursor: pointer;
        }
        .copy-btn:hover { background: #16213e; }
        .antibody-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .antibody-tag {
            background: #e8f0fe;
            color: #0f3460;
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Flow Cytometry Antibody Enumeration</h1>
        <p class="subtitle">Check panels to enumerate unique antibodies across your selection.</p>

        <div id="panels" class="panels"></div>

        <div id="results">
            <h2>Unique Antibodies</h2>
            <div class="results-header">
                <div class="count-badge" id="count-badge"></div>
                <button id="copy-btn" class="copy-btn">Copy list to clipboard</button>
            </div>
            <div class="antibody-list" id="antibody-list"></div>
        </div>
    </div>

    <script type="module" src="index.js"></script>
</body>
</html>
